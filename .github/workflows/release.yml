name: Release LiteAsk (macOS & Windows)

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish signed Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "LiteAsk v__VERSION__"
          releaseBody: |
            ## LiteAsk v__VERSION__

            - 修复划词「翻译 / 解释」浮窗不翻译、只复述「请翻译以下内容：…」的问题：翻译与解释指令改由 system 提示下发，user 消息只发送原文本身，并强化「只输出译文、禁止复述原文或指令」约束（自定义供应商 / 中转模型更明显）
            - 划词浮窗内继续追问时，不再把追问误当成新原文重新翻译
            - 自动更新源切换为 `kylinpoet/LiteAsk`：旧版本（≤ v0.2.3）用户需手动下载安装本版本一次，之后即可恢复一键自动更新
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
